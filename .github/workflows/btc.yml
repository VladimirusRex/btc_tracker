name: BTC Tracker Daily

on:
  schedule:
    - cron: '0 8 * * *'  # Tous les jours à 8h UTC (10h France en été, 9h en hiver)
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Envoyer un message de test Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: btc-tracker

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installer les dépendances
        run: pip install requests

      - name: Prix + Fear & Greed + alerte Telegram
        run: python btc_price_usd.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TOKEN_DU_BOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}

      - name: Committer les données
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add prix_btc_usd.txt
          [ -f achats_dca.csv ] && git add achats_dca.csv
          git commit -m "Données du $(date -u +'%Y-%m-%d')" || echo "Rien à committer"
          git push
